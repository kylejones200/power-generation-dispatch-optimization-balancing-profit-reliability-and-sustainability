[project]
name = "power-generation-dispatch-optimization-balancing-profit-reliability-and-sustaina"
version = "0.1.0"
description = "Companion code for Medium article: power generation dispatch optimization balancing profit reliability and sustainability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "numpy>=2.4.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# Optional Rust extension — build with:
#   pip install maturin && maturin develop --release -m rust/py/Cargo.toml
[tool.maturin]
manifest-path = "rust/py/Cargo.toml"
module-name = "power_generation_dispatch_optimization_balancing_profit_reliability_and_sustainability_rs"

